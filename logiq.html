        function generateSVG() {
            if (nodes.length === 0 && wires.length === 0) return "";
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            
            nodes.forEach(n => {
                let topOffset = n.label ? 25 : 0;
                minX = Math.min(minX, n.x - (n.pinLength||0));
                minY = Math.min(minY, n.y - topOffset); 
                maxX = Math.max(maxX, n.x + n.width + (n.pinLength||0));
                maxY = Math.max(maxY, n.y + n.height);
            });
            wires.forEach(w => w.points.forEach(p => {
                minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
                maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
            }));
            
            let pad = 40; minX -= pad; minY -= pad; maxX += pad; maxY += pad;
            let width = maxX - minX, height = maxY - minY;
            
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${width} ${height}" width="${width}" height="${height}">`;
            svg += `<rect x="${minX}" y="${minY}" width="${width}" height="${height}" fill="transparent" />`;
            
            svg += `<style>
                .wire { stroke: #34495e; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
                .node-rect { fill: #fff; stroke: #333; stroke-width: 2; }
                .pin { stroke: #333; stroke-width: 2; fill: none; }
                .pin-fill { stroke: #333; stroke-width: 2; fill: #fff; }
                .text { fill: #000; font-family: Arial, sans-serif; }
                .text-bold { font-weight: bold; }
            </style>`;
            
            function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

            wires.forEach(w => {
                let d = `M ${w.points[0].x} ${w.points[0].y} `;
                for(let i=1; i<w.points.length; i++) d += `L ${w.points[i].x} ${w.points[i].y} `;
                svg += `<path class="wire" d="${d}" />`;
            });
            
            nodes.forEach(n => {
                let pLen = n.pinLength || 0;
                
                n.inPorts.forEach(p => { 
                    let endX = n.x;
                    if (n instanceof MonoflopNode && n.isNegEdge && p.index === 0) endX -= 8;
                    svg += `<line class="pin" x1="${p.x}" y1="${p.y}" x2="${endX}" y2="${p.y}" />`; 
                });
                
                n.outPorts.forEach(p => { 
                    let startX = n.x + n.width; 
                    if (n.hasInverter && p.index === 0) startX += 8;
                    if ((n.type === 'rs_ff' || n instanceof MonoflopNode) && p.index === 1) startX += 8; 
                    svg += `<line class="pin" x1="${startX}" y1="${p.y}" x2="${p.x}" y2="${p.y}" />`; 
                });

                if (n.hasInverter && n.outPorts.length > 0) {
                    svg += `<circle cx="${n.x + n.width + 4}" cy="${n.outPorts[0].y}" r="4" class="pin-fill" />`;
                }
                if (n.type === 'rs_ff' || n instanceof MonoflopNode) {
                    svg += `<circle cx="${n.x + n.width + 4}" cy="${n.outPorts[1].y}" r="4" class="pin-fill" />`;
                }
                if (n instanceof MonoflopNode && n.isNegEdge) {
                    svg += `<circle cx="${n.x - 4}" cy="${n.inPorts[0].y}" r="4" class="pin-fill" />`;
                }

                if (n.type === 'junction') {
                    svg += `<circle cx="${n.x}" cy="${n.y}" r="6" fill="#000" />`;
                } 
                else if (n instanceof GateNode) {
                    svg += `<rect class="node-rect" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" />`;
                    let sym = (n.type === 'and' || n.type === 'nand') ? '&amp;' : 
                              (n.type === 'xor' || n.type === 'xnor') ? '=1' : '&#8805;1';
                    svg += `<text class="text text-bold" x="${n.x + n.width/2}" y="${n.y + n.height/2}" font-size="24" text-anchor="middle" dominant-baseline="central">${sym}</text>`;
                }
                else if (n instanceof NotNode) {
                    svg += `<rect class="node-rect" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" />`;
                    svg += `<text class="text text-bold" x="${n.x + n.width/2}" y="${n.y + n.height/2}" font-size="24" text-anchor="middle" dominant-baseline="central">1</text>`;
                }
                else if (n.type === 'rs_ff') {
                    svg += `<rect class="node-rect" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" />`;
                    svg += `<text class="text text-bold" x="${n.x+12}" y="${n.y+20}" font-size="24" text-anchor="start" dominant-baseline="central">S</text>`;
                    svg += `<text class="text text-bold" x="${n.x+12}" y="${n.y+60}" font-size="24" text-anchor="start" dominant-baseline="central">R</text>`;
                }
                else if (n instanceof InputNode) {
                    let btnColor = (isSimulating && n.isPressed) ? '#555' : '#888';
                    svg += `<rect class="node-rect" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" />`;
                    svg += `<circle cx="${n.x + n.width/2}" cy="${n.y + 35}" r="24" fill="#fff" stroke="#333" stroke-width="2" />`;
                    svg += `<circle cx="${n.x + n.width/2}" cy="${n.y + 35}" r="18" fill="${btnColor}" stroke="#333" stroke-width="2" />`;
                    let labelText = n.type === 'taster' ? 'Taster' : 'Schalter';
                    svg += `<text fill="#000" font-family="Arial, sans-serif" font-size="16" x="${n.x + n.width/2}" y="${n.y + 68}" text-anchor="middle" dominant-baseline="central">${labelText}</text>`;
                }
                else if (n instanceof OutputNode) {
                    let bgColor = (isSimulating && n.getStableInput(0)) ? '#f1c40f' : '#fff';
                    svg += `<rect class="node-rect" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" fill="${bgColor}" />`;
                    svg += `<text class="text text-bold" x="${n.x + n.width/2}" y="${n.y + n.height/2}" font-size="16" text-anchor="middle" dominant-baseline="central">Output</text>`;
                }
                else if (n instanceof MonoflopNode) {
                    svg += `<rect class="node-rect" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" />`;
                    
                    let px, py = n.y + 30;
                    if (!n.retriggerable) {
                        svg += `<text class="text text-bold" x="${n.x+30}" y="${n.y+25}" font-size="20" text-anchor="middle" dominant-baseline="central">1</text>`;
                        px = n.x + 45;
                    } else {
                        px = n.x + 27;
                    }

                    svg += `<polyline class="pin" points="${px},${py} ${px+8},${py} ${px+8},${py-16} ${px+18},${py-16} ${px+18},${py} ${px+26},${py}" />`;
                    let inY = n.inPorts[0].y;
                    svg += `<polyline class="pin" points="${n.x},${inY-6} ${n.x+10},${inY} ${n.x},${inY+6}" />`;
                }
                
                if (n.label) {
                    svg += `<text class="text text-bold" x="${n.x + (n.width||0)/2}" y="${n.y - 8}" font-size="14" text-anchor="middle">${esc(n.label)}</text>`;
                }
            });
            
            svg += `</svg>`;
            return svg;
        }

        window.exportImageCopy = function() {
            let svgStr = generateSVG();
            if(!svgStr) return;

            let img = new Image();
            let svgBlob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
            let url = URL.createObjectURL(svgBlob);

            img.onload = function() {
                let canvas = document.createElement("canvas");
                let scale = 3; 
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                let ctx = canvas.getContext("2d");
                ctx.scale(scale, scale);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);

                canvas.toBlob(function(blob) {
                    if (!blob) {
                        showModal("Fehler", "<p>Bild konnte nicht generiert werden.</p>", null, true);
                        return;
                    }
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        navigator.clipboard.write([item]).then(() => {
                            showModal("Erfolg", "<p>Die Schaltung wurde als gestochen scharfes <b>PNG-Bild</b> kopiert.<br><br>Du kannst sie nun mit Strg+V überall einfügen (Word, Discord, etc.)!</p>", null, true);
                        }).catch(err => {
                            console.error(err);
                            showModal("Fehler", "<p>Zugriff auf Zwischenablage verweigert.</p>", null, true);
                        });
                    } catch (e) {
                        showModal("Fehler", "<p>Dein Browser unterstützt das direkte Kopieren von Bildern leider nicht.</p>", null, true);
                    }
                }, "image/png");
            };
            img.src = url;
        };

        window.exportSVGDownload = function() {
            let svgStr = generateSVG();
            if(!svgStr) return;
            let blob = new Blob([svgStr], {type: "image/svg+xml"});
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Logik_Schaltung.svg";
            a.click();
            closeModal();
        };

        // --- Zooming & Touch Gestures ---
        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx*dx + dy*dy);
        }

        function getPinchCenter(touches) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: ((touches[0].clientX + touches[1].clientX) / 2) - rect.left,
                y: ((touches[0].clientY + touches[1].clientY) / 2) - rect.top
            };
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;

            const worldX = (screenX - cameraX) / cameraScale;
            const worldY = (screenY - cameraY) / cameraScale;

            const zoomSpeed = 0.1;
            let newScale = cameraScale * (e.deltaY < 0 ? (1 + zoomSpeed) : (1 - zoomSpeed));
            newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

            cameraX = screenX - (worldX * newScale);
            cameraY = screenY - (worldY * newScale);
            cameraScale = newScale;

            updateGridBackground();
            draw();
        }, { passive: false });

        // --- Interaktion & Events ---
        document.querySelectorAll('.component-btn:not(.special-btn)').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('active'));
                if (selectedComponentToPlace === e.target.dataset.type) selectedComponentToPlace = null;
                else { selectedComponentToPlace = e.target.dataset.type; e.target.classList.add('active'); }
                autoCloseMenu(); 
            });
        });

        document.getElementById('sim-btn').addEventListener('click', (e) => {
            isSimulating = !isSimulating;
            const btn = e.target;
            
            if (isSimulating) {
                selectedComponentToPlace = null;
                document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('active'));
                btn.textContent = "Simulation Stoppen"; btn.classList.add('stop');
                
                // Setze globale Tick-Zeit zurück
                lastTickTime = performance.now();

                nodes.forEach(n => {
                    if(n.type === 'taster') n.isPressed = false;
                    n.inPorts.forEach(p => p.state = false);
                    n.outPorts.forEach(p => p.state = false);
                    if(n instanceof MonoflopNode) n.active = false;
                    
                    // Reset der Delay-Speicher beim Neustart der Simulation
                    n.currentRawInputs = [];
                    n.lastStableInputs = [];
                    n.inputStableSince = simTime;
                });
            } else {
                btn.textContent = "Simulation Starten"; btn.classList.remove('stop');
            }
            draw();
        });

        document.getElementById('clear-btn').addEventListener('click', () => { nodes = []; wires = []; draw(); });

        function processRightClickOrLongPress(worldX, worldY) {
            if (isSimulating) return;

            draggingNode = null;
            draggingWireSegment = null;
            wiringStartPort = null;
            if (activeTaster) { activeTaster.isPressed = false; activeTaster = null; }
            
            if (navigator.vibrate) navigator.vibrate(50);

            let hitNode = getNodeAt(worldX, worldY);
            if (hitNode) {
                wires = wires.filter(w => w.fromPort.node !== hitNode && w.toPort.node !== hitNode);
                nodes = nodes.filter(n => n !== hitNode);
                draw(); return;
            }
            let hitWire = getWireAt(worldX, worldY);
            if (hitWire) { wires = wires.filter(w => w !== hitWire); draw(); return; }
        }

        function processDoubleClick(worldX, worldY) {
            if (isSimulating) return;
            let hitNode = getNodeAt(worldX, worldY);

            if (!hitNode) return;

            // Junctions ignorieren, alle anderen Bauteile können benannt werden
            if (hitNode instanceof JunctionNode) return;

            if (hitNode instanceof GateNode) {
                showModal("Gatter Einstellungen", 
                    `<div class="modal-input-group"><label>Name:</label><input type="text" id="node-label" value="${hitNode.label}"></div>
                     <div class="modal-input-group"><label>Anzahl der Eingänge:</label><select id="gate-inputs"><option value="2" ${hitNode.inPorts.length === 2 ? 'selected' : ''}>2 Eingänge</option><option value="3" ${hitNode.inPorts.length === 3 ? 'selected' : ''}>3 Eingänge</option></select></div>`, 
                    () => {
                        hitNode.label = document.getElementById('node-label').value;
                        let num = parseInt(document.getElementById('gate-inputs').value, 10);
                        if (num === 2 || num === 3) { hitNode.setInputs(num); }
                        draw();
                    });
            } else if (hitNode instanceof MonoflopNode) {
                showModal("Monoflop Einstellungen", 
                    `<div class="modal-input-group"><label>Name:</label><input type="text" id="node-label" value="${hitNode.label}"></div>
                     <div class="modal-input-group"><label>Dauer (in ms):</label><input type="number" id="mf-duration" value="${hitNode.duration}" min="1"></div>`, 
                    () => {
                        hitNode.label = document.getElementById('node-label').value;
                        let time = parseInt(document.getElementById('mf-duration').value, 10);
                        if (!isNaN(time) && time > 0) hitNode.duration = time;
                        draw();
                    });
            } else {
                // Für InputNode, OutputNode, RSFlipFlopNode, NotNode
                showModal("Bezeichnung ändern", 
                    `<div class="modal-input-group"><label>Name:</label><input type="text" id="node-label" value="${hitNode.label}"></div>`, 
                    () => { hitNode.label = document.getElementById('node-label').value; draw(); }
                );
            }
        }

        function processPointerDown(clientX, clientY, isRightClick) {
            autoCloseMenu();
            const coords = getWorldCoords(clientX, clientY);
            const x = coords.x, y = coords.y;

            if (isRightClick) { processRightClickOrLongPress(x, y); return; }

            if (isSimulating) {
                let hitNode = getNodeAt(x, y);
                if (hitNode && hitNode.type === 'taster') { hitNode.isPressed = true; activeTaster = hitNode; draw(); return; }
                if (hitNode && hitNode.type === 'schalter') { hitNode.isPressed = !hitNode.isPressed; draw(); return; }
                
                isPanning = true; startPanX = clientX; startPanY = clientY; startCamX = cameraX; startCamY = cameraY;
                canvasContainer.style.cursor = 'grabbing';
                return;
            }

            if (selectedComponentToPlace === 'junction') {
                let sX = snap(x), sY = snap(y);
                let hitWire = getWireAt(sX, sY);
                if (hitWire) {
                    let orientation = 'h';
                    for (let s of hitWire.getSegments()) {
                        let minY = Math.min(s.y1, s.y2), maxY = Math.max(s.y1, s.y2);
                        if (s.x1 === s.x2 && sY >= minY && sY <= maxY && sX === s.x1) { orientation = 'v'; break; }
                    }
                    let j = new JunctionNode(sX, sY, orientation);
                    nodes.push(j); splitWire(hitWire, sX, sY, j);
                    selectedComponentToPlace = null;
                    document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('active'));
                    draw();
                }
                return; 
            }

            if (selectedComponentToPlace) {
                let newNode = createNodeByType(selectedComponentToPlace, x, y);
                if (newNode) {
                    nodes.push(newNode); selectedComponentToPlace = null;
                    document.querySelectorAll('.component-btn').forEach(b => b.classList.remove('active'));
                    draw();
                }
                return;
            }

            let port = getPortAt(x, y);
            if (port) { wiringStartPort = port; return; }

            let dragSeg = getWireDragSegment(x, y);
            if (dragSeg) { draggingWireSegment = dragSeg; return; }

            let hitNode = getNodeAt(x, y);
            if (hitNode) { draggingNode = hitNode; return; }

            isPanning = true; startPanX = clientX; startPanY = clientY; startCamX = cameraX; startCamY = cameraY;
            canvasContainer.style.cursor = 'grabbing';
        }

        function processPointerMove(clientX, clientY) {
            if (isPanning) {
                cameraX = startCamX + (clientX - startPanX); cameraY = startCamY + (clientY - startPanY);
                updateGridBackground(); draw(); return;
            }

            const coords = getWorldCoords(clientX, clientY);
            mouseX = coords.x; mouseY = coords.y;

            if (draggingNode && !isSimulating) {
                draggingNode.x = snap(mouseX - draggingNode.width / 2);
                draggingNode.y = snap(mouseY - draggingNode.height / 2);
                wires.forEach(w => { if (w.fromPort.node === draggingNode || w.toPort.node === draggingNode) w.points = w.calculatePath(w.fromPort, w.toPort); });
                draw(); return;
            }

            if (draggingWireSegment && !isSimulating) {
                let dx = snap(mouseX) - snap(draggingWireSegment.startMouse.x);
                let dy = snap(mouseY) - snap(draggingWireSegment.startMouse.y);
                let w = draggingWireSegment.wire, i = draggingWireSegment.index, startPts = draggingWireSegment.startPts;
                
                if (draggingWireSegment.type === 'v') {
                    w.points[i].x = startPts[i].x + dx; w.points[i+1].x = startPts[i+1].x + dx;
                } else {
                    w.points[i].y = startPts[i].y + dy; w.points[i+1].y = startPts[i+1].y + dy;
                }
                draw(); return;
            }

            if (!isSimulating && (wiringStartPort || selectedComponentToPlace)) draw();
        }

        function processPointerUp() {
            if (isPanning) { isPanning = false; canvasContainer.style.cursor = 'crosshair'; }
            if (draggingNode) draggingNode = null;
            if (draggingWireSegment) draggingWireSegment = null;
            if (isSimulating && activeTaster) { activeTaster.isPressed = false; activeTaster = null; draw(); }

            if (wiringStartPort && !isSimulating) {
                let endPort = getPortAt(mouseX, mouseY);
                if (!endPort) {
                    let hitWire = getWireAt(mouseX, mouseY);
                    if (hitWire) {
                        let sX = snap(mouseX), sY = snap(mouseY); let orientation = 'h';
                        for (let s of hitWire.getSegments()) {
                            let minY = Math.min(s.y1, s.y2), maxY = Math.max(s.y1, s.y2);
                            if (s.x1 === s.x2 && sY >= minY && sY <= maxY && sX === s.x1) { orientation = 'v'; break; }
                        }
                        let j = new JunctionNode(sX, sY, orientation); nodes.push(j); splitWire(hitWire, sX, sY, j);
                        let newPort = new Port(j, wiringStartPort.type === 'out' ? 'in' : 'out', j.inPorts.length, 0);
                        if (wiringStartPort.type === 'out') j.inPorts.push(newPort); else j.outPorts.push(newPort);
                        endPort = newPort;
                    }
                }

                if (endPort && endPort.node !== wiringStartPort.node) {
                    let from = wiringStartPort, to = endPort;
                    if (wiringStartPort.type === 'in' && endPort.type === 'out') { from = endPort; to = wiringStartPort; }
                    else if (wiringStartPort.type === 'in' && endPort.type === 'in' && endPort.node.type === 'junction') { from = wiringStartPort; to = endPort; }
                    else if (wiringStartPort.type === 'out' && endPort.type === 'out' && endPort.node.type === 'junction') { from = endPort; to = wiringStartPort; }

                    if ((from.type === 'out' || from.node.type === 'junction') && (to.type === 'in' || to.node.type === 'junction')) {
                        if (to.node.type !== 'junction') wires = wires.filter(w => w.toPort !== to); 
                        wires.push(new Wire(from, to));
                    }
                }
                wiringStartPort = null; draw();
            }
        }

        // --- Maus Events ---
        canvas.addEventListener('mousedown', e => processPointerDown(e.clientX, e.clientY, e.button === 2));
        canvas.addEventListener('mousemove', e => processPointerMove(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', e => processPointerUp());
        canvas.addEventListener('mouseleave', () => { processPointerUp(); });
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('dblclick', e => {
            const wCoords = getWorldCoords(e.clientX, e.clientY);
            processDoubleClick(wCoords.x, wCoords.y);
        });

        // --- Touch Events ---
        canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                initialPinchDistance = getPinchDistance(e.touches);
                initialPinchScale = cameraScale;
                pinchCenterScreen = getPinchCenter(e.touches);
                pinchCenterWorld = {
                    x: (pinchCenterScreen.x - cameraX) / cameraScale,
                    y: (pinchCenterScreen.y - cameraY) / cameraScale
                };
                isPanning = false; 
                clearTimeout(longPressTimer);
                return;
            }
            if (e.touches.length > 2) return; 

            e.preventDefault(); 
            const touch = e.touches[0];
            touchStartX = touch.clientX; touchStartY = touch.clientY;
            isLongPress = false;

            if (!isSimulating) {
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    const wCoords = getWorldCoords(touchStartX, touchStartY);
                    processRightClickOrLongPress(wCoords.x, wCoords.y);
                }, 1000);
            }
            processPointerDown(touch.clientX, touch.clientY, false);
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            
            if (e.touches.length === 2 && initialPinchDistance) {
                const currentDistance = getPinchDistance(e.touches);
                const scaleFactor = currentDistance / initialPinchDistance;
                let newScale = initialPinchScale * scaleFactor;
                newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
                
                const currentCenterScreen = getPinchCenter(e.touches);
                cameraX = currentCenterScreen.x - (pinchCenterWorld.x * newScale);
                cameraY = currentCenterScreen.y - (pinchCenterWorld.y * newScale);
                cameraScale = newScale;
                updateGridBackground(); draw(); return;
            }
            if (e.touches.length > 1) return;

            const touch = e.touches[0];
            if (Math.abs(touch.clientX - touchStartX) > 10 || Math.abs(touch.clientY - touchStartY) > 10) { clearTimeout(longPressTimer); }
            if (!isLongPress) processPointerMove(touch.clientX, touch.clientY);
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (e.touches.length > 0) {
                initialPinchDistance = null;
                const touch = e.touches[0];
                startPanX = touch.clientX; startPanY = touch.clientY;
                startCamX = cameraX; startCamY = cameraY;
                return;
            }

            initialPinchDistance = null;
            clearTimeout(longPressTimer);
            
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 300 && tapLength > 0 && !isLongPress) {
                const wCoords = getWorldCoords(touchStartX, touchStartY);
                processDoubleClick(wCoords.x, wCoords.y);
            }
            lastTapTime = currentTime;

            if (!isLongPress) processPointerUp();
        }, { passive: false });

        canvas.addEventListener('touchcancel', () => {
            initialPinchDistance = null; clearTimeout(longPressTimer); processPointerUp();
        });

        // --- Render Loop mit Virtual Time Sub-Steps ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(cameraX, cameraY);
            ctx.scale(cameraScale, cameraScale);

            if (selectedComponentToPlace && !isSimulating && selectedComponentToPlace !== 'junction') {
                ctx.globalAlpha = 0.5;
                let tempNode = createNodeByType(selectedComponentToPlace, snap(mouseX), snap(mouseY));
                if (tempNode) tempNode.draw(ctx);
                ctx.globalAlpha = 1.0;
            }

            if (selectedComponentToPlace === 'junction' && !isSimulating) {
                let sX = snap(mouseX), sY = snap(mouseY);
                if (getWireAt(sX, sY)) {
                    ctx.beginPath(); ctx.arc(sX, sY, 6, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
                }
            }

            wires.forEach(w => w.draw(ctx));
            
            if (wiringStartPort && !isSimulating) {
                ctx.strokeStyle = '#aaa'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
                let dummyNode = {type: 'dummy', x: snap(mouseX), y: snap(mouseY)};
                let dummyPort = {x: snap(mouseX), y: snap(mouseY), node: dummyNode, type: 'in'}; 
                let fromP = wiringStartPort; let toP = dummyPort;
                if (wiringStartPort.type === 'in' && wiringStartPort.node.type !== 'junction') { fromP = dummyPort; toP = wiringStartPort; }
                
                let dummyWire = new Wire(fromP, toP); ctx.beginPath();
                if (dummyWire.points.length > 0) {
                    ctx.moveTo(dummyWire.points[0].x, dummyWire.points[0].y);
                    dummyWire.points.forEach(p => ctx.lineTo(p.x, p.y));
                }
                ctx.stroke(); ctx.setLineDash([]);
            }

            nodes.forEach(n => n.draw(ctx));
            ctx.restore(); 
        }

        function simulationTick() {
            let now = performance.now();
            
            if (isSimulating) {
                // dt ist die reale vergangene Zeit seit dem letzten Frame in Millisekunden
                let dt = Math.floor(now - lastTickTime);
                
                // Limitiere dt, falls der Browser im Hintergrund war (verhindert gigantische Zeitsprünge)
                if (dt > 100) { dt = 100; lastTickTime = now - 100; }

                if (dt > 0) {
                    // "Virtual Time Step Engine": 
                    // Die Simulation berechnet *jeden* Frame in exakten 1ms-Schritten intern nach.
                    // So können Laufzeiten, die kürzer sind als die Framerate (z.B. 5ms vs 16.6ms) 
                    // fehlerfrei verarbeitet werden und "überholen" sich nicht mehr.
                    for(let step = 0; step < dt; step++) {
                        simTime++;
                        nodes.forEach(n => n.processDelayAndUpdateLogic(simTime));
                        wires.forEach(w => w.updateLogic());
                    }
                    
                    lastTickTime += dt; // Behält evtl. Nachkommastellen für den nächsten Frame

                    draw();

                    // Daten für Impulsdiagramm aufzeichnen
                    if (isRecording) {
                        let t = simTime - recordStartTime;
                        recordedSignals.forEach(sig => {
                            let currState = sig.port.state;
                            let lastState = sig.data[sig.data.length - 1].state;
                            if (currState !== lastState) {
                                sig.data.push({ t: t, state: currState });
                            }
                        });
                    }
                }
            } else {
                lastTickTime = now;
            }
            requestAnimationFrame(simulationTick);
        }

        // --- Status laden, falls in der HTML-Datei eingebettet ---
        if (typeof window.SAVED_STATE !== 'undefined') {
            try {
                loadState(window.SAVED_STATE);
            } catch (e) {
                console.error("Fehler beim Laden des Schaltungs-Status:", e);
            }
        }

        resizeCanvas();
        simulationTick();

    </script>
</body>
</html>
